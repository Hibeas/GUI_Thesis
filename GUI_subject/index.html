<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant Panel - Station</title>
    <style>
        body {
            font-family: monospace;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #111;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border: 2px solid #000;
            box-shadow: 8px 8px 0px #000;
            text-align: center;
            max-width: 680px;
            width: 90%;
        }
        .station-badge {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 6px 16px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        h2 { margin: 10px 0; font-size: 1.1em; color: #444; }
        .status-box {
            border: 1px dashed #000;
            padding: 15px;
            margin: 15px 0;
            background-color: #fafafa;
        }
        #status { font-weight: bold; font-size: 1.1em; }
        .camera-box {
            margin-top: 15px;
            border: 1px solid #000;
            background: #000;
            display: inline-block;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="station-badge" id="stationCodeDisplay">Station: ---</div>
        
        <h2 id="participantId">Assigned Participant: Waiting...</h2>

        <div class="status-box">
            <div id="status">Status: Connecting to system...</div>
            <div id="experimentInfo" style="margin-top: 8px; color: #555;">Experiment: No active information</div>
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Station Camera Preview:</label>
            <div class="camera-box">
                <img id="videoStream" src="" width="640" height="480" alt="No camera signal" />
            </div>
        </div>
    </div>

<script>
    let isStreamActive = false;

    async function checkStatus() {
        try {
            const response = await fetch('/status');
            const data = await response.json();
            
            document.getElementById('stationCodeDisplay').innerText = "Station: " + data.station_code;
            document.getElementById('participantId').innerText = "Assigned Participant: " + (data.subject_id || "None");
            
            const statusElem = document.getElementById('status');
            const expInfo = document.getElementById('experimentInfo');
            const videoElem = document.getElementById('videoStream');

            if (data.is_running) {
                statusElem.innerText = 'STATUS: EXPERIMENT IN PROGRESS (RECORDING)';
                statusElem.style.color = '#008000';
                expInfo.innerText = `Experiment: ${data.experiment_id}`;

                if (!isStreamActive) {
                    videoElem.src = '/video_feed';
                    isStreamActive = true;
                }
            } else {
                statusElem.innerText = 'STATUS: Station Active (Waiting for researcher)';
                statusElem.style.color = '#000000';
                expInfo.innerText = 'Experiment has not been configured yet.';

                if (isStreamActive) {
                    videoElem.src = '';
                    isStreamActive = false;
                }
            }
        } catch (error) {
            document.getElementById('status').innerText = 'STATUS: Connection error with local service!';
            document.getElementById('status').style.color = 'red';
        }
    }

    setInterval(checkStatus, 2000);
    checkStatus();
</script>
</body>
</html>
