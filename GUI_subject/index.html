<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Uczestnika - Stanowisko</title>
    <style>
        body {
            font-family: monospace;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #111;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border: 2px solid #000;
            box-shadow: 8px 8px 0px #000;
            text-align: center;
            max-width: 680px;
            width: 90%;
        }
        .station-badge {
            display: inline-block;
            background-color: #000;
            color: #fff;
            padding: 6px 16px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        h2 { margin: 10px 0; font-size: 1.1em; color: #444; }
        .status-box {
            border: 1px dashed #000;
            padding: 15px;
            margin: 15px 0;
            background-color: #fafafa;
        }
        #status { font-weight: bold; font-size: 1.1em; }
        .camera-box {
            margin-top: 15px;
            border: 1px solid #000;
            background: #000;
            display: inline-block;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="station-badge" id="stationCodeDisplay">Stanowisko: ---</div>
        
        <h2 id="participantId">Przypisany Uczestnik: Oczekiwanie...</h2>

        <div class="status-box">
            <div id="status">Status: Łączenie z systemem...</div>
            <div id="experimentInfo" style="margin-top: 8px; color: #555;">Eksperyment: Brak aktywnych informacji</div>
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 8px;">Podgląd Kamery Stanowiska:</label>
            <div class="camera-box">
                <img id="videoStream" src="" width="640" height="480" alt="Brak sygnału z kamery" />
            </div>
        </div>
    </div>

<script>
    let isStreamActive = false;

    async function checkStatus() {
        try {
            const response = await fetch('/status');
            const data = await response.json();
            
            document.getElementById('stationCodeDisplay').innerText = "Stanowisko: " + data.station_code;
            document.getElementById('participantId').innerText = "Przypisany Uczestnik: " + (data.subject_id || "Brak");
            
            const statusElem = document.getElementById('status');
            const expInfo = document.getElementById('experimentInfo');
            const videoElem = document.getElementById('videoStream');

            if (data.is_running) {
                statusElem.innerText = 'STATUS: EKSPERYMENT W TOKU (NAGRYWANIE)';
                statusElem.style.color = '#008000';
                expInfo.innerText = `Eksperyment: ${data.experiment_id}`;

                if (!isStreamActive) {
                    videoElem.src = '/video_feed';
                    isStreamActive = true;
                }
            } else {
                statusElem.innerText = 'STATUS: Stanowisko Aktywne (Oczekiwanie na badacza)';
                statusElem.style.color = '#000000';
                expInfo.innerText = 'Eksperyment nie został jeszcze skonfigurowany.';

                if (isStreamActive) {
                    videoElem.src = '';
                    isStreamActive = false;
                }
            }
        } catch (error) {
            document.getElementById('status').innerText = 'STATUS: Błąd połączenia z lokalnym serwisem!';
            document.getElementById('status').style.color = 'red';
        }
    }

    setInterval(checkStatus, 2000);
    checkStatus();
</script>
</body>
</html>
