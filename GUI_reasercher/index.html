<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Badacza (Researcher GUI)</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 5px; text-transform: uppercase; }
        h3 { margin-top: 0; font-weight: normal; color: #555; }
        
        .section {
            border: 1px solid #000;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        label { font-weight: bold; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, select, button {
            font-family: monospace;
            padding: 8px;
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #000;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }
        button:hover { background-color: #333; }

        .btn-stop {
            background-color: #d9534f;
            color: #fff;
            display: none;
        }
        .btn-stop:hover { background-color: #c9302c; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #f0f0f0; }
        .table-select { margin: 0; padding: 4px; width: 100%; font-family: monospace; }
        .active-session-banner {
            background-color: #f8f8f8;
            border-left: 4px solid #000;
            padding: 10px;
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .radio-group label {
            display: inline;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <!-- KONFIGURACJA I SELEKCJA EKSPERYMENTU -->
    <div class="section">
        <h2>Konfiguracja Eksperymentu</h2>
        
        <div class="active-session-banner">
            <h1 id="display-experiment" style="font-size: 1.2em;">Brak aktywnego eksperymentu</h1>
            <h3 id="display-details" style="margin:0;">Start: --- | Stop: --- | Session ID: ---</h3>
        </div>

        <form id="experiment-form">
            <div class="radio-group">
                <label><input type="radio" name="mode" value="select" checked id="mode-select"> Wybierz istniejący</label>
                <label><input type="radio" name="mode" value="new" id="mode-new"> Utwórz nowy</label>
            </div>

            <!-- Wybór istniejącego eksperymentu -->
            <div id="container-select">
                <label for="session-select">Eksperyment z bazy:</label>
                <select id="session-select">
                    <option value="">-- Wybierz eksperyment --</option>
                </select>
            </div>

            <!-- Pole nowej nazwy -->
            <div id="container-new" style="display: none;">
                <label for="exp-type-new">Nowa nazwa / typ eksperymentu:</label>
                <input type="text" id="exp-type-new" placeholder="np. Watching Videos">
            </div>

            <!-- Lokalizacja -->
            <label for="exp-location">Lokalizacja:</label>
            <input type="text" id="exp-location" placeholder="Lokalizacja (np. Politechnika Gdańska)" required>

            <!-- Aktywne Stanowiska -->
            <label style="margin-top: 15px;">Aktywne Stanowiska (Przypisz Badanego do Każdego Stanowiska):</label>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">ID Stanowiska</th>
                        <th style="width: 70%;">Wybierz Uczestnika</th>
                    </tr>
                </thead>
                <tbody id="stations-table-body">
                </tbody>
            </table>

            <button type="submit" id="btn-start" style="margin-top: 10px;">ROZPOCZNIJ EKSPERYMENT</button>
            <button type="button" id="btn-stop" class="btn-stop" style="margin-top: 10px;">ZATRZYMAJ EKSPERYMENT</button>
        </form>
    </div>

    <!-- DODAWANIE PARTICIPANTA -->
    <div class="section">
        <h2>Dodaj nowego uczestnika</h2>
        <form id="new-participant-form">
            <input type="text" id="new-participant-name" placeholder="Imię i nazwisko" required>
            <input type="date" id="new-participant-birth" required>
            <select id="new-participant-gender" required>
                <option value="">-- Wybierz płeć --</option>
                <option value="Male">Mężczyzna</option>
                <option value="Female">Kobieta</option>
                <option value="Other">Inna</option>
            </select>
            <button type="submit">Zapisz uczestnika</button>
        </form>
    </div>

<script>
    let allSessions = [];
    let allParticipants = [];
    let activeStationsList = [];
    let activeSessionId = null;

    document.getElementById('mode-select').addEventListener('change', toggleMode);
    document.getElementById('mode-new').addEventListener('change', toggleMode);

    function toggleMode() {
        const isSelectMode = document.getElementById('mode-select').checked;
        document.getElementById('container-select').style.display = isSelectMode ? 'block' : 'none';
        document.getElementById('container-new').style.display = isSelectMode ? 'none' : 'block';
        
        if (!isSelectMode) {
            document.getElementById('exp-location').value = '';
        } else {
            updateLocationFromSelect();
        }
    }

    document.getElementById('session-select').addEventListener('change', updateLocationFromSelect);

    function updateLocationFromSelect() {
        const selectedId = document.getElementById('session-select').value;
        const session = allSessions.find(s => s.sessionid == selectedId);
        if (session) {
            document.getElementById('exp-location').value = session.location;
        } else {
            document.getElementById('exp-location').value = '';
        }
    }

    document.getElementById('new-participant-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('new-participant-name').value,
            birthday: document.getElementById('new-participant-birth').value,
            gender: document.getElementById('new-participant-gender').value
        };
        
        const response = await fetch('/api/participants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (response.ok) {
            document.getElementById('new-participant-form').reset();
            await loadParticipants();
            renderStationsTable();
            alert("Uczestnik dodany pomyślnie!");
        } else {
            alert("Błąd podczas zapisu uczestnika.");
        }
    });

    async function loadParticipants() {
        const response = await fetch('/api/participants');
        allParticipants = await response.json();
    }

    async function loadSessions() {
        const response = await fetch('/api/sessions');
        allSessions = await response.json();
        
        const select = document.getElementById('session-select');
        select.innerHTML = '<option value="">-- Wybierz eksperyment --</option>';
        
        allSessions.forEach(session => {
            const option = document.createElement('option');
            option.value = session.sessionid;
            option.textContent = `ID: ${session.sessionid} - ${session.experiment_type} (${session.location})`;
            select.appendChild(option);
        });
    }

    async function loadStations() {
        const response = await fetch('/api/stations');
        activeStationsList = await response.json();
        renderStationsTable();
    }

    function renderStationsTable() {
        const tbody = document.getElementById('stations-table-body');
        
        const currentSelections = {};
        tbody.querySelectorAll('select').forEach(sel => {
            if (sel.dataset.stationCode) {
                currentSelections[sel.dataset.stationCode] = sel.value;
            }
        });

        tbody.innerHTML = '';
        
        if (activeStationsList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#666;">Brak aktywnych stacji w bazie danych.</td></tr>';
            return;
        }

        activeStationsList.forEach(st => {
            const tr = document.createElement('tr');
            const savedValue = currentSelections[st.station_code] || '';

            let selectHtml = `<select class="table-select station-participant-select" data-station-code="${st.station_code}" required>`;
            selectHtml += '<option value="">-- WYBIERZ BADANEGO --</option>';
            
            allParticipants.forEach(p => {
                const isSelected = (p.id === savedValue) ? 'selected' : '';
                selectHtml += `<option value="${p.id}" ${isSelected}>${p.name} (ID: ${p.id})</option>`;
            });
            selectHtml += '</select>';

            tr.innerHTML = `<td><strong>${st.station_code}</strong></td><td>${selectHtml}</td>`;
            tbody.appendChild(tr);
        });
    }

    // Uruchomienie eksperymentu
    document.getElementById('experiment-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (activeStationsList.length === 0) {
            alert("Brak aktywnych stacji!");
            return;
        }

        const isSelectMode = document.getElementById('mode-select').checked;
        let expType = "";

        if (isSelectMode) {
            const selectedId = document.getElementById('session-select').value;
            const session = allSessions.find(s => s.sessionid == selectedId);
            if (!session) {
                alert("Wybierz eksperyment z listy!");
                return;
            }
            expType = session.experiment_type;
        } else {
            expType = document.getElementById('exp-type-new').value.trim();
            if (!expType) {
                alert("Wpisz nazwę nowego eksperymentu!");
                return;
            }
        }

        const location = document.getElementById('exp-location').value.trim();
        const stationSelects = document.querySelectorAll('.station-participant-select');
        const assignments = [];
        const usedParticipantIds = new Set();

        for (const selectElem of stationSelects) {
            const stationCode = selectElem.dataset.stationCode;
            const participantId = selectElem.value;

            if (!participantId) {
                alert(`Proszę wybrać badanego dla stanowiska ${stationCode}!`);
                selectElem.focus();
                return;
            }

            if (usedParticipantIds.has(participantId)) {
                alert(`Uczestnik o ID ${participantId} został przypisany do więcej niż jednego stanowiska!`);
                selectElem.focus();
                return;
            }

            usedParticipantIds.add(participantId);
            assignments.push({
                station_code: stationCode,
                participant_id: participantId
            });
        }

        const payload = {
            experiment_type: expType,
            location: location,
            assignments: assignments
        };

        const response = await fetch('/api/sessions/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            const data = await response.json();
            activeSessionId = data.session_id;

            document.getElementById('display-experiment').innerText = `AKTYWNY: ${expType}`;
            document.getElementById('display-details').innerText = `Start: ${data.start_time} | Stop: W toku... | Session ID: ${activeSessionId}`;
            
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';

            await loadSessions();
            alert(`Eksperyment rozpoczęty! (ID Sesji: ${activeSessionId})`);
        } else {
            alert("Błąd podczas uruchamiania eksperymentu.");
        }
    });

    // Zatrzymanie eksperymentu
    document.getElementById('btn-stop').addEventListener('click', async () => {
        if (!activeSessionId) return;

        const response = await fetch('/api/sessions/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: activeSessionId })
        });

        if (response.ok) {
            const data = await response.json();
            
            const currentDetails = document.getElementById('display-details').innerText;
            document.getElementById('display-details').innerText = currentDetails.replace('Stop: W toku...', `Stop: ${data.end_time}`);
            
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';

            alert(`Eksperyment (ID: ${activeSessionId}) został zakończony o ${data.end_time}`);
            activeSessionId = null;
            await loadSessions();
        } else {
            alert("Błąd podczas zatrzymywania eksperymentu.");
        }
    });

    window.onload = async () => {
        await loadParticipants();
        await loadSessions();
        await loadStations();
        setInterval(loadStations, 5000);
    };
</script>
</body>
</html>
