<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Researcher GUI</title>
    <style>
        body {
            font-family: monospace;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 5px; text-transform: uppercase; }
        h3 { margin-top: 0; font-weight: normal; color: #555; }
        
        .section {
            border: 1px solid #000;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        label { font-weight: bold; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, select, button {
            font-family: monospace;
            padding: 8px;
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            background-color: #000;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }
        button:hover { background-color: #333; }

        .btn-stop {
            background-color: #d9534f;
            color: #fff;
            display: none;
        }
        .btn-stop:hover { background-color: #c9302c; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #f0f0f0; }
        .table-select { margin: 0; padding: 4px; width: 100%; font-family: monospace; }
        .active-session-banner {
            background-color: #f8f8f8;
            border-left: 4px solid #000;
            padding: 10px;
            margin-bottom: 15px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .radio-group label {
            display: inline;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <!-- EXPERIMENT CONFIGURATION AND SELECTION -->
    <div class="section">
        <h2>Experiment Configuration</h2>
        
        <div class="active-session-banner">
            <h1 id="display-experiment" style="font-size: 1.2em;">No active experiment</h1>
            <h3 id="display-details" style="margin:0;">Start: --- | Stop: --- | Session ID: ---</h3>
        </div>

        <form id="experiment-form">
            <div class="radio-group">
                <label><input type="radio" name="mode" value="select" checked id="mode-select"> Select existing</label>
                <label><input type="radio" name="mode" value="new" id="mode-new"> Create new</label>
            </div>

            <!-- Select existing experiment -->
            <div id="container-select">
                <label for="session-select">Experiment from database:</label>
                <select id="session-select">
                    <option value="">-- Select experiment --</option>
                </select>
            </div>

            <!-- New experiment name field -->
            <div id="container-new" style="display: none;">
                <label for="exp-type-new">New experiment name / type:</label>
                <input type="text" id="exp-type-new" placeholder="e.g., Watching Videos">
            </div>

            <!-- Location -->
            <label for="exp-location">Location:</label>
            <input type="text" id="exp-location" placeholder="Location (e.g., Gdańsk University of Technology)" required>

            <!-- Active Stations -->
            <label style="margin-top: 15px;">Active Stations (Assign Participant and Sensor):</label>
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">Station</th>
                        <th style="width: 45%;">Select Participant</th>
                        <th style="width: 35%;">LSL Sensor (Shimmer)</th>
                    </tr>
                </thead>
                <tbody id="stations-table-body">
                </tbody>
            </table>

            <button type="submit" id="btn-start" style="margin-top: 10px;">START EXPERIMENT</button>
            <button type="button" id="btn-stop" class="btn-stop" style="margin-top: 10px;">STOP EXPERIMENT</button>
        </form>
    </div>

    <!-- ADD PARTICIPANT -->
    <div class="section">
        <h2>Add New Participant</h2>
        <form id="new-participant-form">
            <input type="text" id="new-participant-name" placeholder="Full name" required>
            <input type="date" id="new-participant-birth" required>
            <select id="new-participant-gender" required>
                <option value="">-- Select gender --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <button type="submit">Save Participant</button>
        </form>
    </div>

<script>
    let allSessions = [];
    let allParticipants = [];
    let activeStationsList = [];
    let activeSessionId = null;

    document.getElementById('mode-select').addEventListener('change', toggleMode);
    document.getElementById('mode-new').addEventListener('change', toggleMode);

    function toggleMode() {
        const isSelectMode = document.getElementById('mode-select').checked;
        document.getElementById('container-select').style.display = isSelectMode ? 'block' : 'none';
        document.getElementById('container-new').style.display = isSelectMode ? 'none' : 'block';
        
        if (!isSelectMode) {
            document.getElementById('exp-location').value = '';
        } else {
            updateLocationFromSelect();
        }
    }

    document.getElementById('session-select').addEventListener('change', updateLocationFromSelect);

    function updateLocationFromSelect() {
        const selectedId = document.getElementById('session-select').value;
        const session = allSessions.find(s => s.sessionid == selectedId);
        if (session) {
            document.getElementById('exp-location').value = session.location;
        } else {
            document.getElementById('exp-location').value = '';
        }
    }

    document.getElementById('new-participant-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('new-participant-name').value,
            birthday: document.getElementById('new-participant-birth').value,
            gender: document.getElementById('new-participant-gender').value
        };
        
        const response = await fetch('/api/participants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (response.ok) {
            document.getElementById('new-participant-form').reset();
            await loadParticipants();
            renderStationsTable();
            alert("Participant added successfully!");
        } else {
            alert("Error while saving participant.");
        }
    });

    async function loadParticipants() {
        const response = await fetch('/api/participants');
        allParticipants = await response.json();
    }

    async function loadSessions() {
        const response = await fetch('/api/sessions');
        allSessions = await response.json();
        
        const select = document.getElementById('session-select');
        select.innerHTML = '<option value="">-- Select experiment --</option>';
        
        allSessions.forEach(session => {
            const option = document.createElement('option');
            option.value = session.sessionid;
            option.textContent = `ID: ${session.sessionid} - ${session.experiment_type} (${session.location})`;
            select.appendChild(option);
        });
    }


    function renderStationsTable() {
        const tbody = document.getElementById('stations-table-body');
        
        const currentParticipants = {};
        const currentSensors = {};
        
        tbody.querySelectorAll('.station-participant-select').forEach(sel => {
            currentParticipants[sel.dataset.stationCode] = sel.value;
        });
        tbody.querySelectorAll('.station-sensor-input').forEach(inp => {
            currentSensors[inp.dataset.stationCode] = inp.value;
        });

        tbody.innerHTML = '';
        
        if (activeStationsList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#666;">No active stations in the database.</td></tr>';
            return;
        }

        activeStationsList.forEach(st => {
            const tr = document.createElement('tr');
            const savedPart = currentParticipants[st.station_code] || '';
            const savedSensor = currentSensors[st.station_code] !== undefined ? currentSensors[st.station_code] : 'Shimmer_C1D2';

            let selectHtml = `<select class="table-select station-participant-select" data-station-code="${st.station_code}" required>`;
            selectHtml += '<option value="">-- SELECT PARTICIPANT --</option>';
            
            allParticipants.forEach(p => {
                const isSelected = (p.id === savedPart) ? 'selected' : '';
                selectHtml += `<option value="${p.id}" ${isSelected}>${p.name} (ID: ${p.id})</option>`;
            });
            selectHtml += '</select>';

            const sensorInputHtml = `<input type="text" class="table-select station-sensor-input" data-station-code="${st.station_code}" value="${savedSensor}" placeholder="e.g., Shimmer_C1D2">`;

            tr.innerHTML = `<td><strong>${st.station_code}</strong></td><td>${selectHtml}</td><td>${sensorInputHtml}</td>`;
            tbody.appendChild(tr);
        });
    }

    // Start experiment
    document.getElementById('experiment-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        if (activeStationsList.length === 0) {
            alert("No active stations!");
            return;
        }

        const isSelectMode = document.getElementById('mode-select').checked;
        let expType = "";

        if (isSelectMode) {
            const selectedId = document.getElementById('session-select').value;
            const session = allSessions.find(s => s.sessionid == selectedId);
            if (!session) {
                alert("Please select an experiment from the list!");
                return;
            }
            expType = session.experiment_type;
        } else {
            expType = document.getElementById('exp-type-new').value.trim();
            if (!expType) {
                alert("Please enter the name of the new experiment!");
                return;
            }
        }

        const location = document.getElementById('exp-location').value.trim();
        const stationRows = document.querySelectorAll('#stations-table-body tr');
        const assignments = [];
        const usedParticipantIds = new Set();

        for (const row of stationRows) {
            const selectElem = row.querySelector('.station-participant-select');
            const sensorInput = row.querySelector('.station-sensor-input');
            if (!selectElem) continue;

            const stationCode = selectElem.dataset.stationCode;
            const participantId = selectElem.value;
            const sensorName = sensorInput ? sensorInput.value.trim() : "";

            if (!participantId) {
                alert(`Please select a participant for station ${stationCode}!`);
                selectElem.focus();
                return;
            }

            if (usedParticipantIds.has(participantId)) {
                alert(`Participant with ID ${participantId} has been assigned to more than one station!`);
                selectElem.focus();
                return;
            }

            usedParticipantIds.add(participantId);
            assignments.push({
                station_code: stationCode,
                participant_id: participantId,
                sensor_name: sensorName || null
            });
        }

        const payload = {
            experiment_type: expType,
            location: location,
            assignments: assignments
        };

        const response = await fetch('/api/sessions/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            const data = await response.json();
            activeSessionId = data.session_id;

            document.getElementById('display-experiment').innerText = `ACTIVE: ${expType}`;
            document.getElementById('display-details').innerText = `Start: ${data.start_time} | Stop: In progress... | Session ID: ${activeSessionId}`;
            
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';

            await loadSessions();
            alert(`Experiment started! (Session ID: ${activeSessionId})`);
        } else {
            alert("Error while starting the experiment.");
        }
    });

    // Stop experiment
    document.getElementById('btn-stop').addEventListener('click', async () => {
        if (!activeSessionId) return;

        const response = await fetch('/api/sessions/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: activeSessionId })
        });

        if (response.ok) {
            const data = await response.json();
            
            const currentDetails = document.getElementById('display-details').innerText;
            document.getElementById('display-details').innerText = currentDetails.replace('Stop: In progress...', `Stop: ${data.end_time}`);
            
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';

            alert(`Experiment (ID: ${activeSessionId}) ended at ${data.end_time}`);
            activeSessionId = null;
            await loadSessions();
            await loadStations(true);
        } else {
            alert("Error while stopping the experiment.");
        }
    });
    let lastStationsHash = "";

    async function loadStations(forceRender = false) {
        // Nie odpytuj, jeśli karta jest w tle lub eksperyment już trwa
        if (document.hidden || activeSessionId !== null) return;

        try {
            const response = await fetch('/api/stations');
            const newStations = await response.json();
            const newHash = JSON.stringify(newStations);

            if (forceRender || newHash !== lastStationsHash) {
                lastStationsHash = newHash;
                activeStationsList = newStations;
                renderStationsTable();
            }
        } catch (err) {
            console.error("Failed to fetch stations:", err);
        }
    }

    // Natychmiastowe odświeżenie po powrocie na kartę przeglądarki
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && activeSessionId === null) {
            loadStations();
        }
    });

    window.onload = async () => {
        await loadParticipants();
        await loadSessions();
        await loadStations(true);
        setInterval(() => loadStations(false), 5000);
    };
</script>
</body>
</html>
